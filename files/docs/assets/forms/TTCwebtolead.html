        <script>
    document.addEventListener('DOMContentLoaded', function() {
        const leadForm = document.querySelector('form[action*="webto.salesforce.com"]');

        if (leadForm) {
            const customMultiselectContainers = leadForm.querySelectorAll('.custom-multiselect-container');

            customMultiselectContainers.forEach(container => {
                const sfFieldId = container.dataset.sfFieldId;
                if (!sfFieldId) {
                    console.warn("Custom multiselect container missing data-sf-field-id:", container);
                    return;
                }

                const salesforceHiddenInput = leadForm.querySelector(`input[name="${sfFieldId}"][type="hidden"]`);

                if (!salesforceHiddenInput) {
                    console.warn(`No hidden input found for Salesforce field ID: ${sfFieldId} for container:`, container);
                    return;
                }

                container.addEventListener('click', function(e) {
                    if (e.target.tagName === 'INPUT' && e.target.type === 'checkbox') {
                        e.target.closest('label').classList.toggle('selected', e.target.checked);
                    }
                });
            });

            leadForm.addEventListener('submit', function(e) {
                leadForm.querySelectorAll('.custom-multiselect-container').forEach(container => {
                    const sfFieldId = container.dataset.sfFieldId;
                    const salesforceHiddenInput = leadForm.querySelector(`input[name="${sfFieldId}"][type="hidden"]`);

                    if (salesforceHiddenInput) {
                        const checkedCheckboxes = container.querySelectorAll('input[type="checkbox"]:checked');
                        const selectedValues = [];

                        checkedCheckboxes.forEach(checkbox => {
                            selectedValues.push(checkbox.value);
                        });

                        salesforceHiddenInput.value = selectedValues.join(';');

                        // console.log(`Submitting field ${sfFieldId} as:`, salesforceHiddenInput.value); // Uncomment for debugging
                    }
                });
            });
        }
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
      const leadForm = document.querySelector('form');
      
      leadForm.addEventListener('submit', function (e) {
        e.preventDefault(); // Stop default redirect
    
        // Store where the user came from
        const returnPage = document.referrer || '/';
    
        // Optionally show a thank you message
        leadForm.innerHTML = `
          <div style="text-align:center; font-family:sans-serif; padding:2em;">
            <h2>Thank you for your submission!</h2>
            <p>We’ve received your details. Redirecting you back...</p>
          </div>
        `;
    
        // Send the form to Salesforce
        fetch(leadForm.action, {
          method: 'POST',
          body: new FormData(leadForm),
          mode: 'no-cors'
        }).catch(err => console.warn('Submission error:', err));
    
        // Redirect after 3 seconds
        setTimeout(() => {
          window.location.href = returnPage;
        }, 3000);
      });
    });
    </script>
